name: release-windows-cuda13

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and upload"
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows:
    uses: ./.github/workflows/release-windows-variant.yml
    with:
      tag: ${{ github.event.release.tag_name || github.event.inputs.tag }}
      variant: cuda13
      ort-package: microsoft.ml.onnxruntime.gpu.windows
      ort-version: "1.32.0"
      asset-suffix: "-cuda13"
