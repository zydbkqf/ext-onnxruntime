name: release-windows-cuda12

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and upload"
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows:
    uses: ./.github/workflows/release-windows-variant.yml
    with:
      tag: ${{ github.event.release.tag_name || github.event.inputs.tag }}
      variant: cuda12
      ort-asset: onnxruntime-win-x64-gpu_cuda12-1.28.2.zip
      ort-dir: onnxruntime-win-x64-gpu_cuda12-1.28.2
      asset-suffix: "-cuda12"
