name: release-windows-cuda12

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and upload"
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows:
    uses: ./.github/workflows/release-windows-variant.yml
    with:
      tag: ${{ github.event.release.tag_name || github.event.inputs.tag }}
      variant: cuda12
      ort-package: microsoft.ml.onnxruntime.gpu.windows
      ort-version: "1.26.0"
      ort-sha256: "2820b8cca24b7c2817f28aa6ea8774a5c519295caa7447b86d190c7079aabf0f"
      asset-suffix: "-cuda12"
