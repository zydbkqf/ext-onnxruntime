name: build

on:
  push:
  pull_request:

jobs:
  smoke:
    name: ${{ matrix.os }} (PHP ${{ matrix.php-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            php-version: "8.6"
          - os: macos-15
            php-version: "8.6"

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none

      - name: Cache ONNX Runtime NuGet SDK
        uses: actions/cache@v4
        with:
          path: ~/.cache/ext-onnxruntime/nuget
          key: ort-nuget-${{ runner.os }}-${{ runner.arch }}-cpu-1.32.0

      - name: Install Linux sanitizer toolchain
        if: runner.os == 'Linux'
        run: |
          if command -v clang >/dev/null 2>&1 && command -v clang++ >/dev/null 2>&1; then
            echo "clang already present: $(clang++ --version | head -n 1)"
            exit 0
          fi
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends clang

      - name: Verify package.xml covers the tree
        run: bash tests/check-package-contents.sh

      - name: Build and load smoke
        run: bash tests/build-smoke.sh

      - name: Native sanitizers
        if: runner.os == 'Linux'
        run: bash tests/run-sanitizers.sh

  compat:
    name: compat-php-${{ matrix.php-version }} (build only)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.0", "8.4"]
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none

      - name: Cache ONNX Runtime NuGet SDK
        uses: actions/cache@v4
        with:
          path: ~/.cache/ext-onnxruntime/nuget
          key: ort-nuget-${{ runner.os }}-${{ runner.arch }}-cpu-1.32.0

      - name: Build against PHP ${{ matrix.php-version }}
        run: |
          set -euo pipefail
          phpize --clean
          phpize
          ./configure
          make -j8
          php -n -d extension="$PWD/modules/onnxruntime.so" --ri onnxruntime >/dev/null

  windows:
    name: windows-2025 (PHP 8.5, advisory)
    runs-on: windows-2025
    # Advisory only: it mirrors the release-windows build so packaging breaks
    # show up before a release, but the runner's VS toolset provisioning for
    # the vs18 PHP SDKs is intermittent, so a red Windows job is not treated
    # as a release blocker -- release-windows.yml stays the authoritative gate.
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Fetch ONNX Runtime SDK from NuGet
        uses: ./.github/actions/fetch-onnxruntime
        with:
          package: microsoft.ml.onnxruntime
          version: "1.32.0"
          sha256: a9150bc2992cbbb6722070da9910e1ffa989a8bfc67bdd5bb8e745ca755641db
          rid: win-x64
          destination: ${{ github.workspace }}/ort/sdk

      - name: Build the extension
        uses: php/php-windows-builder/extension@v1
        with:
          php-version: "8.5"
          arch: x64
          ts: nts
          args: --with-onnxruntime=${{ github.workspace }}/ort/sdk
          run-tests: false

  freebsd:
    name: freebsd-14.5 (pkg php85)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Start FreeBSD VM
        id: vm
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.5"
          copyback: false

      - name: Install packages in FreeBSD
        shell: freebsd {0}
        run: |
          set -eux
          for attempt in 1 2 3; do
            if pkg install -y php85 onnxruntime autoconf gmake pkgconf unzip curl bash; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              exit 1
            fi
            sleep 10
          done
          php -v
          php-config --version
          pkg info php85 onnxruntime

      - name: Build and test in FreeBSD
        shell: freebsd {0}
        run: |
          set -eux
          # ONNX Runtime 1.30 prints a cpuinfo warning to stderr during
          # startup on FreeBSD, which would otherwise break every PHPT diff.
          cat > /tmp/php-ort-wrap <<'EOF'
          #!/bin/sh
          tmp=$(mktemp /tmp/php-ort.XXXXXX) || exit 1
          /usr/local/bin/php "$@" 2>"$tmp"
          status=$?
          grep -v -E 'cpuid_info.cc|Unknown CPU vendor|cpuinfo_vendor value' "$tmp" >&2
          rm -f "$tmp"
          exit $status
          EOF
          chmod +x /tmp/php-ort-wrap
          mkdir -p /tmp/freebsd-bin
          ln -sf /usr/local/bin/gmake /tmp/freebsd-bin/make
          PATH=/tmp/freebsd-bin:$PATH PHP_BIN=/tmp/php-ort-wrap bash tests/build-smoke.sh /usr/local
