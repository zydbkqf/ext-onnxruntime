name: release-windows

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and upload"
        required: true
        type: string

permissions:
  contents: write

jobs:
  matrix:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
    outputs:
      matrix: ${{ steps.extension-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Get the extension matrix
        id: extension-matrix
        uses: php/php-windows-builder/extension-matrix@v1
        with:
          php-version-list: "8.0, 8.1, 8.2, 8.3, 8.4, 8.5, 8.6"
          arch-list: "x64"
          ts-list: "nts, ts"

  build:
    needs: matrix
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Fetch ONNX Runtime SDK from NuGet
        uses: ./.github/actions/fetch-onnxruntime
        with:
          package: microsoft.ml.onnxruntime
          version: "1.32.0"
          sha256: a9150bc2992cbbb6722070da9910e1ffa989a8bfc67bdd5bb8e745ca755641db
          rid: win-x64
          destination: ${{ github.workspace }}/ort/sdk

      - name: Build the extension
        uses: php/php-windows-builder/extension@v1
        with:
          php-version: ${{ matrix.php-version }}
          arch: ${{ matrix.arch }}
          ts: ${{ matrix.ts }}
          extension-ref: ${{ env.RELEASE_TAG }}
          args: --with-onnxruntime=${{ github.workspace }}\ort\sdk
          run-tests: false

  release:
    needs: build
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - name: Fetch ONNX Runtime runtime DLL from NuGet
        uses: ./.github/actions/fetch-onnxruntime
        with:
          package: microsoft.ml.onnxruntime
          version: "1.32.0"
          sha256: a9150bc2992cbbb6722070da9910e1ffa989a8bfc67bdd5bb8e745ca755641db
          rid: win-x64
          destination: ${{ github.workspace }}/ort/sdk

      - name: Add onnxruntime.dll to the PIE zips
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $dll = Join-Path $env:GITHUB_WORKSPACE "ort/sdk/lib/onnxruntime.dll"
          if (-not (Test-Path -LiteralPath $dll)) {
            throw "onnxruntime.dll not found in the SDK"
          }
          Get-ChildItem -LiteralPath "artifacts" -Filter "php_onnxruntime-*.zip" -Recurse | ForEach-Object {
            $zipPath = $_.FullName
            $archive = [IO.Compression.ZipFile]::Open($zipPath, "Update")
            try {
              if (-not ($archive.Entries | Where-Object { $_.FullName -eq "onnxruntime.dll" })) {
                [IO.Compression.ZipFileExtensions]::CreateEntryFromFile(
                  $archive, $dll, "onnxruntime.dll", [IO.Compression.CompressionLevel]::Optimal) | Out-Null
              }
            } finally {
              $archive.Dispose()
            }
          }

      - name: Remove stale main-named PIE assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          names=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | grep '^php_onnxruntime-main-' || true)
          while IFS= read -r name; do
            if [ -n "$name" ]; then
              gh release delete-asset "$RELEASE_TAG" "$name" --yes
            fi
          done <<< "$names"

      - name: Upload assets to the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mapfile -t zips < <(find artifacts -maxdepth 1 -name 'php_onnxruntime-*.zip' -print | sort -u)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "No PIE zips found in artifacts"
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${zips[@]}" --clobber
